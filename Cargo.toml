[package]
name = "x-client-transaction"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the X Client Transaction library"
authors = ["Langkor <langkor@outlook.com>"]

[dependencies]
reqwest = { version = "0.12.15", features = ["blocking", "cookies"] }
scraper = "0.23.1"
regex = "1.11.1"
rand = "0.9.1"
base64 = "0.22.1"
sha2 = "0.10.9"
lazy_static = "1.5.0"
thiserror = "2.0.12"
url = "2.5.4"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }

[lib]
name = "x_client_transaction"
path = "src/lib.rs"

[[bin]]
name = "quickstart"
path = "src/bin/quickstart.rs"
